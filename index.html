<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>[2026年度4月版]授業の交換先をすぐに見つける君©Takahiro Iimura</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    h1 { font-size: 1.3rem; margin-bottom: 1rem; }
    h2 { font-size: 1.1rem; margin-top: 1.4rem; }
    p, label { display:block; margin-top:0.6rem; }
    select,input { padding:4px; }
    table { border-collapse:collapse; margin-top:0.6rem; width:100%; max-width:1200px; }
    th,td { border:1px solid #ccc; padding:6px 8px; font-size:0.9rem; text-align:left; vertical-align: top; }
    th { background:#f0f0f0; font-size:1.1rem; }
    tbody tr:hover { background:#f5f5f5; }

    .training-conflict { color: red; font-weight: 700; }
    .self-training     { color: purple; font-weight: 700; }
    .parttime-row      { color: blue; font-weight: 700; }

    .muted { color:#666; font-size:0.9rem; }
    .nowrap { white-space: nowrap; }
    .notice { font-size:0.9rem; color:#444; }
    .hidden { display:none; }
    .btn { padding:8px 12px; border:1px solid #999; border-radius:6px; background:#f5f5f5; cursor:pointer; }
    .inline { display:inline-block; margin-right:10px; }
    .hr { margin: 24px 0; border: none; border-top: 1px dotted #ddd; }
    .select-with-search { display:inline-flex; align-items:center; gap:6px; }
    .search-input { width: 160px; }

    .info-warning { color: orange; }

    /* 教員名ホバー用 */
    .teacher-name { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }

    /* 画面上部レイアウト：左＝各種プルダウン（縦）、右＝教員A時間割 */
    .layout-main {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .control-column {
      min-width: 260px;
      max-width: 360px;
    }

    /* 右上の時間割ツールチップ（ホバー／固定共通） */
    #teacherTimetableTooltip {
      position: fixed;
      top: 80px;
      right: 20px;
      background: #fff;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      max-width: 360px;
      max-height: 60vh;
      overflow-y: auto;
      z-index: 999;
    }
    #teacherTimetableTooltip h3 {
      margin: 0 0 4px;
      font-size: 0.9rem;
    }
    .tt-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      font-size: 0.7rem;   /* 授業名を少し小さく */
    }
    .tt-table th,
    .tt-table td {
      border: 1px solid #ccc;
      padding: 2px 3px;
      vertical-align: top;
      word-wrap: break-word;
      word-break: break-all;
    }
    .tt-table th {
      background: #f7f7f7;
      text-align: center;
    }
    .tt-lesson {
      font-size: 0.7rem;
      line-height: 1.25;
    }
    .tt-training {
      font-size: 0.65rem;
      color: #c00;
      line-height: 1.25;
    }

    /* ★追加：空きコマクリックできる見た目 */
    .tt-empty {
      cursor: pointer;
      background: #fcfcff;
    }
    .tt-empty:hover {
      outline: 2px solid #777;
      outline-offset: -2px;
      background: #f3f7ff;
    }

    /* 教員Aの時間割（常時表示・横幅拡大） */
    #teacherATimetableContainer {
      min-width: 340px;
      max-width: 520px;
      max-height: 360px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    #teacherATimetableContainer h3 {
      margin: 0 0 4px;
      font-size: 0.9rem;
    }
    #teacherATimetableContainer .tt-table {
      font-size: 0.7rem;
    }

    /* クラス別時間割 */
    #classTtPanel {
      margin-top: 0.8rem;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
    }
    #classTtControls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    #classTtControls label {
      margin-top: 0;
    }
    .class-tt-container {
      background:#fff;
      padding:8px;
      border-radius:6px;
      border:1px solid #ddd;
      display:inline-block;
    }
    .class-tt-header {
      font-weight:700;
      margin-bottom:4px;
      text-align:left;
    }
    .class-tt-table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
      table-layout: fixed;
      font-size: 0.8rem;
    }
    .class-tt-table th,
    .class-tt-table td {
      border: 1px solid #ccc;
      padding: 4px 4px;
      vertical-align: top;
      text-align: center;
      word-wrap: break-word;
      word-break: break-all;
    }
    .class-tt-table th {
      background: #f7f7f7;
    }
    .class-tt-subject {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      line-height: 1.2;
    }
    .class-tt-teacher {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      color: #444;
      line-height: 1.2;
    }

    /* ★追加：空きコマ→振替候補パネル */
    #movePanel {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: min(720px, calc(100vw - 40px));
      max-height: 60vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #999;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      padding: 10px 12px;
      z-index: 1000;
    }
    #movePanelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    #movePanelHeader h3 {
      margin: 0;
      font-size: 0.95rem;
    }
    #movePanelCloseBtn {
      padding: 6px 10px;
      border: 1px solid #999;
      border-radius: 8px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #movePanelBody table { max-width: none; }
  </style>

  <!-- html2canvas（時間割を画像として保存するため） -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <h1>[2026年度4月版]
      授業の交換先をすぐに見つける君
      ©Takahiro Iimura</h1>

<img src="images/photo.png"
     alt="写真"
     style="width:10%; height:auto; float:right; margin-right:100px;">

  <!-- 教員A/B/C + 交換したい授業（左カラム） ＋ 教員A時間割（右） -->
  <div class="layout-main">
    <div class="control-column">
      <!-- 教員A（検索内包） -->
      <div class="select-with-search">
        <label>教員A:
          <select id="teacherSelectA" disabled>
            <option value="">データ読み込み待機中</option>
          </select>
          <input id="teacherSearchA" class="search-input" type="text" placeholder="名前で絞り込み" aria-label="教員A検索" />
        </label>
      </div>

      <!-- 教員B：選択されたら合同扱い。候補はAの合同者のみ -->
      <label style="margin-top:0.8rem;">教員B（合同授業の場合）:
        <select id="teacherSelectB" disabled>
          <option value="">教員Bを選択</option>
        </select>
      </label>

      <!-- 教員C：3人合同対応。B選択後に「残りの教員」が自動候補 -->
      <label style="margin-top:0.8rem;">教員C（合同授業の場合）:
        <select id="teacherSelectC" disabled>
          <option value="">教員Cを選択</option>
        </select>
      </label>

      <!-- 交換したい授業 -->
      <label style="margin-top:0.8rem;">交換したい授業:
        <select id="lessonSelect" disabled>
          <option value="">教員A（合同授業の場合B・C）を選んでください</option>
        </select>
      </label>

      <p class="muted" style="margin-top:0.8rem;">
        ※教員A時間割の「空きコマ」をクリックすると、そのコマに振替可能な自分の授業を表示します。
      </p>
    </div>

    <!-- 教員Aの時間割（常時表示） -->
    <div id="teacherATimetableContainer"></div>
  </div>

  <div id="results1to1" style="margin-top:1.2rem;"></div>
  <div id="results3way"  style="margin-top:1.2rem;"></div>

  <hr class="hr" />

  <!-- ===== クラス別時間割 ===== -->
  <button id="toggleClassTtBtn" type="button" class="btn" aria-controls="classTtPanel" aria-expanded="false">
    クラス別時間割を表示
  </button>
  <div id="classTtPanel" class="hidden">
    <div id="classTtControls">
      <label>クラス選択:
        <select id="classTtSelect">
          <option value="">授業CSV読み込み後に選択できます</option>
        </select>
      </label>
      <button id="classTtDownloadBtn" type="button" class="btn" disabled>
        このクラスの時間割画像をダウンロード
      </button>
    </div>
    <div id="classTtTableContainer" class="class-tt-container"></div>
  </div>

  <hr class="hr" />

  <!-- ===== CSV設定 ===== -->
  <button id="toggleCsvBtn" type="button" class="btn" aria-controls="csvPanel" aria-expanded="false">
    CSV設定を表示
  </button>

  <div id="csvPanel" class="hidden">
    <p class="notice"><strong>アップロードで上書き可能</strong></p>

    <p><strong>① 研修CSV</strong></p>
    <label>
      研修CSVを読み込む:<br>
      <input type="file" id="fileTrainings" accept=".csv" />
    </label>

    <p><strong>② 高校CSV</strong></p>
    <label>高校の授業CSVを読み込む:
      <input type="file" id="fileLessonsHS" accept=".csv" />
      <br><span class="muted">読み込み時に既存の高校データを更新</span>
    </label>

    <p><strong>③ 中学CSV</strong></p>
    <label>中学の授業CSVを読み込む:
      <input type="file" id="fileLessonsJH" accept=".csv" />
      <br><span class="muted">読み込み時に既存の中学データを更新</span>
    </label>
  </div>

  <!-- 交換相手・担当者の時間割表示用ツールチップ -->
  <div id="teacherTimetableTooltip" class="hidden"></div>

  <!-- ★追加：空きコマ→振替候補パネル -->
  <div id="movePanel" class="hidden" role="dialog" aria-modal="false" aria-label="振替候補パネル">
    <div id="movePanelHeader">
      <h3 id="movePanelTitle">振替候補</h3>
      <button id="movePanelCloseBtn" type="button">閉じる</button>
    </div>
    <div id="movePanelBody"></div>
    <p class="muted" style="margin-top:6px;">
      ※「交換で可能」は、ターゲット側の該当授業が「1ユニット（同一signature）」の場合のみ表示（文理分割などで2ユニットになる場合は除外）。
    </p>
  </div>

  <script>
    // ===== CSV設定トグル =====
    const toggleCsvBtn = document.getElementById('toggleCsvBtn');
    const csvPanel  = document.getElementById('csvPanel');
    toggleCsvBtn.addEventListener('click', () => {
      const nowHidden = csvPanel.classList.toggle('hidden');
      toggleCsvBtn.setAttribute('aria-expanded', String(!nowHidden));
      toggleCsvBtn.textContent = nowHidden ? 'CSV設定を表示' : 'CSV設定を非表示';
    });

    // ===== クラス別時間割トグル =====
    const toggleClassTtBtn = document.getElementById('toggleClassTtBtn');
    const classTtPanel = document.getElementById('classTtPanel');
    const classTtSelect = document.getElementById('classTtSelect');
    const classTtTableContainer = document.getElementById('classTtTableContainer');
    const classTtDownloadBtn = document.getElementById('classTtDownloadBtn');

    toggleClassTtBtn.addEventListener('click', () => {
      const nowHidden = classTtPanel.classList.toggle('hidden');
      toggleClassTtBtn.setAttribute('aria-expanded', String(!nowHidden));
      toggleClassTtBtn.textContent = nowHidden ? 'クラス別時間割を表示' : 'クラス別時間割を非表示';
    });

    // ★追加：振替候補パネル
    const movePanel = document.getElementById('movePanel');
    const movePanelTitle = document.getElementById('movePanelTitle');
    const movePanelBody  = document.getElementById('movePanelBody');
    const movePanelCloseBtn = document.getElementById('movePanelCloseBtn');
    movePanelCloseBtn.addEventListener('click', ()=> movePanel.classList.add('hidden'));

    // ===== 埋め込みサンプルCSV =====
    const EMBEDDED_TRAININGS_CSV = `teacher,day,slot,detail,day1,slot1,detail1,day2,slot2,detail2,day3,slot3,detail3,day4,slot4,detail4,day5,slot5,detail5,day6,slot6,detail6
`;

    const EMBEDDED_LESSONS_HS_CSV = `teacher,grade,class,course,day,period,subject,group
`;

    const EMBEDDED_LESSONS_JH_CSV = `teacher,grade,class,course,day,period,subject,group
`;

    // ===== 定数・共通変数 =====
    const DAY_MAP_IN = {
      "mon":"Mon","monday":"Mon","月":"Mon",
      "tue":"Tue","tuesday":"Tue","火":"Tue",
      "wed":"Wed","wednesday":"Wed","水":"Wed",
      "thu":"Thu","thursday":"Thu","木":"Thu",
      "fri":"Fri","friday":"Fri","金":"Fri",
      "sat":"Sat","saturday":"Sat","土":"Sat"
    };
    const DAY_JA_OUT = {Mon:"月",Tue:"火",Wed:"水",Thu:"木",Fri:"金",Sat:"土"};
    const DAY_ORDER  = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    const collatorJA = new Intl.Collator('ja');

    const DAYS_FOR_TT    = ["Mon","Tue","Wed","Thu","Fri","Sat"];
    const PERIODS_FOR_TT = [1,2,3,4,5,6,7];

    let lessonsHS = [];
    let lessonsJH = [];
    let lessons   = [];

    let trainingEventsMap = new Map();
    let trainingTeachers  = new Set();

    let signatureIndex = new Map();
    let unitIndex      = new Map();
    let scheduleState  = new Map();

    // クラス別時間割用
    let classTtOptions = [];      // { key, label }
    let currentClassTtLabel = ""; // ファイル名／画像タイトル用

    const fileLessonsHS   = document.getElementById('fileLessonsHS');
    const fileLessonsJH   = document.getElementById('fileLessonsJH');
    const fileTrainings   = document.getElementById('fileTrainings');
    const teacherSelectA  = document.getElementById('teacherSelectA');
    const teacherSelectB  = document.getElementById('teacherSelectB');
    const teacherSelectC  = document.getElementById('teacherSelectC');
    const teacherSearchA  = document.getElementById('teacherSearchA');
    const lessonSelect    = document.getElementById('lessonSelect');
    const results1to1Div  = document.getElementById('results1to1');
    const results3wayDiv  = document.getElementById('results3way');
    const timetableTooltip = document.getElementById('teacherTimetableTooltip');
    const teacherATimetableContainer = document.getElementById('teacherATimetableContainer');

    let pinnedTeachers = null; // 右上ツールチップの固定対象

    // ===== 汎用パーサ =====
    function parseCSV(t){
      return t.replace(/^\uFEFF/,'')
              .trim()
              .split(/\r?\n/)
              .map(l => l.split(',').map(s => s.trim()));
    }
    function normalizeDay(d){
      if(!d) return "";
      const k = String(d).toLowerCase();
      return DAY_MAP_IN[k] || d;
    }
    function parseDigit(s){
      if(!s && s!==0) return NaN;
      const m = String(s).match(/\d+/);
      return m ? parseInt(m[0],10) : NaN;
    }
    function parseGrade(g){
      const n = parseDigit(g);
      return [1,2,3].includes(n) ? n : NaN;
    }
    function parseClass(c){ return parseDigit(c); }
    function parsePeriod(p){
      const n = parseDigit(p);
      return (n>=1 && n<=7) ? n : NaN;
    }
    function normalizeCourse(c){
      if(!c) return "";
      const raw = String(c).trim();
      const low = raw.toLowerCase();
      if (["文","文系","humanities","arts","h"].includes(low)) return "文";
      if (["理","理系","science","sci","s"].includes(low))      return "理";
      return raw;
    }

    function getPeriodsForSlotValue(slotVal){
      if(!slotVal) return [];
      const s = String(slotVal).trim();
      if (s === "1-4" || s === "1〜4" || s === "1-4限" || s === "1〜4限") {
        return [1,2,3,4];
      }
      if (s === "5-7" || s === "5〜7" || s === "5-7限" || s === "5〜7限") {
        return [5,6,7];
      }
      const n = parsePeriod(s);
      return Number.isNaN(n) ? [] : [n];
    }

    // ===== 研修・会議 =====
    function eventKey(teacher, day, period){
      return teacher + "|" + day + "|" + period;
    }

    function addTrainingEvent(teacher, day, period, label){
      if(!teacher || !day || Number.isNaN(period)) return;
      if(!["Mon","Tue","Wed","Thu","Fri","Sat"].includes(day)) return;
      const key = eventKey(teacher, day, period);
      if(!trainingEventsMap.has(key)) trainingEventsMap.set(key, new Set());
      if(label && label.trim()) trainingEventsMap.get(key).add(label.trim());
    }

    function isParttimeTeacher(t){
      if(!t) return false;
      return !trainingTeachers.has(t);
    }

    function hasAnyEvent(teacher, day, period){
      if(!teacher || !day || !period) return false;
      const key = eventKey(teacher, day, period);
      return trainingEventsMap.has(key);
    }

    function getTrainingDetailLabel(teacher, day, period){
      if(!teacher || !day || !period) return "";
      const key = eventKey(teacher, day, period);
      const set = trainingEventsMap.get(key);
      if(!set || !set.size) return "";
      const labels = Array.from(set);
      return teacher + ": " + labels.join("、");
    }

    function loadTrainingsFromText(text){
      const d = parseCSV(text);
      trainingEventsMap = new Map();
      trainingTeachers  = new Set();

      if(d.length < 2) return;

      const h = d[0].map(x => x.toLowerCase());
      const iT    = h.indexOf('teacher');
      const iD0   = h.indexOf('day');
      const iS0   = h.indexOf('slot');
      const iDet0 = h.indexOf('detail');

      const iD1  = h.indexOf('day1');
      const iS1  = h.indexOf('slot1');
      const iDe1 = h.indexOf('detail1');
      const iD2  = h.indexOf('day2');
      const iS2  = h.indexOf('slot2');
      const iDe2 = h.indexOf('detail2');
      const iD3  = h.indexOf('day3');
      const iS3  = h.indexOf('slot3');
      const iDe3 = h.indexOf('detail3');
      const iD4  = h.indexOf('day4');
      const iS4  = h.indexOf('slot4');
      const iDe4 = h.indexOf('detail4');
      const iD5  = h.indexOf('day5');
      const iS5  = h.indexOf('slot5');
      const iDe5 = h.indexOf('detail5');
      const iD6  = h.indexOf('day6');
      const iS6  = h.indexOf('slot6');
      const iDe6 = h.indexOf('detail6');

      function extractExtra(r, iD, iS, iDet){
        if(iD < 0 || iS < 0) return null;
        const day     = normalizeDay(r[iD]);
        const periods = getPeriodsForSlotValue(r[iS]);
        const detail  = (iDet >= 0 && r[iDet]) ? String(r[iDet]).trim() : "";
        if(!day || !periods.length) return null;
        if(!["Mon","Tue","Wed","Thu","Fri","Sat"].includes(day)) return null;
        return { day, periods, detail };
      }

      d.slice(1).forEach(r => {
        const teacher = r[iT];
        if (!teacher) return;

        trainingTeachers.add(teacher);

        const baseDay    = normalizeDay(r[iD0]);
        const baseSlots  = getPeriodsForSlotValue(r[iS0]);
        const baseDetail = (iDet0 >= 0 && r[iDet0]) ? String(r[iDet0]).trim() : "";

        const hasBase = baseDay &&
                        baseSlots.length>0 &&
                        ["Mon","Tue","Wed","Thu","Fri","Sat"].includes(baseDay);

        if(hasBase){
          baseSlots.forEach(p => {
            addTrainingEvent(teacher, baseDay, p, baseDetail || "研修");
          });
        }

        const e1 = extractExtra(r, iD1, iS1, iDe1); if(e1) e1.periods.forEach(p=>addTrainingEvent(teacher, e1.day, p, e1.detail || "会議"));
        const e2 = extractExtra(r, iD2, iS2, iDe2); if(e2) e2.periods.forEach(p=>addTrainingEvent(teacher, e2.day, p, e2.detail || "会議"));
        const e3 = extractExtra(r, iD3, iS3, iDe3); if(e3) e3.periods.forEach(p=>addTrainingEvent(teacher, e3.day, p, e3.detail || "会議"));
        const e4 = extractExtra(r, iD4, iS4, iDe4); if(e4) e4.periods.forEach(p=>addTrainingEvent(teacher, e4.day, p, e4.detail || "会議"));
        const e5 = extractExtra(r, iD5, iS5, iDe5); if(e5) e5.periods.forEach(p=>addTrainingEvent(teacher, e5.day, p, e5.detail || "会議"));
        const e6 = extractExtra(r, iD6, iS6, iDe6); if(e6) e6.periods.forEach(p=>addTrainingEvent(teacher, e6.day, p, e6.detail || "会議"));
      });
    }

    // ===== 授業データ =====
    function parseLessonsCore(text){
      const d = parseCSV(text);
      if(d.length<2) return [];
      const h = d[0].map(x => x.toLowerCase());
      const iT     = h.indexOf('teacher');
      const iG     = h.indexOf('grade');
      const iC     = h.indexOf('class');
      const iCourse= h.indexOf('course');
      const iD     = h.indexOf('day');
      const iP     = h.indexOf('period');
      const iS     = h.indexOf('subject');
      const iGrp   = h.indexOf('group');

      return d.slice(1).map(r => ({
        teacher : r[iT],
        grade   : parseGrade(r[iG]),
        class   : parseClass(r[iC]),
        course  : normalizeCourse(r[iCourse]),
        day     : normalizeDay(r[iD]),
        period  : parsePeriod(r[iP]),
        subject : r[iS],
        group   : (iGrp>=0 ? (r[iGrp] || "") : "")
      })).filter(l =>
        l.teacher &&
        [1,2,3].includes(l.grade) &&
        ["Mon","Tue","Wed","Thu","Fri","Sat"].includes(l.day) &&
        !Number.isNaN(l.period)
      );
    }

    function loadLessonsFromTextHS(text){
      lessonsHS = parseLessonsCore(text).map(l => ({ ...l, school:"HS" }));
      rebuildLessons();
    }
    function loadLessonsFromTextJH(text){
      lessonsJH = parseLessonsCore(text).map(l => ({ ...l, school:"JH" }));
      rebuildLessons();
    }

    // ===== キー =====
    function unitKeyForTeacherSlot(l){
      return (l.school||"") + "|" + l.teacher + "|" + l.day + "|" + l.period + "|" + (l.subject||"");
    }
    function signatureKey(l){
      return (l.school||"") + "|" + l.day + "|" + l.period + "|" + l.grade + "|" + l.class + "|" + (l.course||"") + "|" + (l.subject||"");
    }

    // ===== インデックス =====
    function getUnitLessons(l){
      const key = unitKeyForTeacherSlot(l);
      return unitIndex.get(key) || [];
    }
    function getAllTeachersForLesson(l){
      const entry = signatureIndex.get(signatureKey(l));
      if(!entry){
        return l.teacher ? [l.teacher] : [];
      }
      return Array.from(entry.teachers).sort((a,b)=>collatorJA.compare(a,b));
    }
    function getCoteachersOfTeacher(name){
      const res = new Set();
      signatureIndex.forEach(entry => {
        if(entry.teachers.has(name) && entry.teachers.size>1){
          entry.teachers.forEach(t => {
            if(t!==name) res.add(t);
          });
        }
      });
      return Array.from(res);
    }

    function getSchoolLabel(l){
      if(l.school === "HS") return "【高】";
      if(l.school === "JH") return "【中】";
      return "";
    }

    // 時間割用短縮表示
    function renderLessonShortForTimetable(l){
      const school = getSchoolLabel(l);
      const grade  = l.grade;
      const cls    = l.class;
      let courseSuffix = "";
      if (grade >= 2 && l.school === "HS") {
        if (l.course === "文") courseSuffix = "文";
        else if (l.course === "理") courseSuffix = "理";
      }
      const classPart = (!Number.isNaN(grade) && !Number.isNaN(cls))
        ? grade + "年" + cls + courseSuffix
        : "";
      const subj = (l.subject || "").trim();
      return school + classPart + (subj ? " " + subj : "");
    }

    // メイン表示用授業名
    function renderLessonTextBase(l){
      const unit = getUnitLessons(l);
      if (!unit.length) return "";

      const base    = unit[0];
      const school  = getSchoolLabel(base);
      const dayJa   = DAY_JA_OUT[base.day] || base.day;
      const period  = base.period;
      const grade   = base.grade;

      const byClass = new Map();
      unit.forEach(x => {
        if (Number.isNaN(x.class)) return;
        const key = x.class;
        if (!byClass.has(key)) byClass.set(key, new Set());
        if (x.course) byClass.get(key).add(x.course);
      });

      const classNos = Array.from(byClass.keys()).sort((a,b)=>a-b);
      const labels = classNos.map(cls => {
        const set = byClass.get(cls);
        let suffix = "";
        if (grade >= 2 && base.school === "HS") {
          const hasBun = set.has("文");
          const hasRi  = set.has("理");
          if (hasBun && hasRi) {
            suffix = "文理";
          } else if (hasBun) {
            suffix = "文";
          } else if (hasRi) {
            suffix = "理";
          }
        }
        return suffix ? (cls + suffix) : String(cls);
      });

      const classStr = classNos.length ? (grade + "年" + labels.join("・") + "組") : (grade + "年");

      let coursePart = "";
      if (grade >= 2 && base.school === "HS") {
        let hasBun = false;
        let hasRi  = false;
        unit.forEach(x => {
          if (x.grade === grade && !Number.isNaN(x.class)) {
            if (x.course === "文") hasBun = true;
            else if (x.course === "理") hasRi = true;
          }
        });
        if (hasBun && hasRi) coursePart = "（文理）";
        else if (hasBun)     coursePart = "（文）";
        else if (hasRi)      coursePart = "（理）";
      }

      const subjectList = [];
      unit.forEach(x => {
        const s = (x.subject || "").trim();
        if (!s) return;
        if (!subjectList.includes(s)) subjectList.push(s);
      });
      const subjectPart = subjectList.length ? (" " + subjectList.join(" / ")) : "";

      return school + dayJa + period + "限" + classStr + coursePart + subjectPart;
    }
    function renderLessonTextForDropdown(l){ return renderLessonTextBase(l); }
    function renderLessonTextForResult(l){
      const unit = getUnitLessons(l);
      if (!unit.length) return renderLessonTextBase(l);

      const baseText = renderLessonTextBase(l);
      const subject  = unit[0].subject;
      if (subject === "情報") {
        return baseText + '<span class="info-warning">（※情報教室の重複に注意）</span>';
      }
      return baseText;
    }

    function isJointLessonForTeacher(target){
      const unit = getUnitLessons(target);
      if (!unit.length) return false;
      return unit.length > 1;
    }
    function renderMyLessonText(l){
      let text = renderLessonTextForResult(l);
      if (isJointLessonForTeacher(l)) {
        text += "（合同）";
      }
      return text;
    }

    function getPriority(target, me){
      const joint     = isJointLessonForTeacher(target);
      const hasEvent  = hasAnyEvent(target.teacher, me.day, me.period);
      const parttime  = isParttimeTeacher(target.teacher);
      if(!joint && !hasEvent && !parttime) return 3;
      if(joint && !hasEvent && !parttime)  return 2;
      if(hasEvent && !parttime)            return 1;
      return 0;
    }

    function sameClassAndCourse(a,b){
      return a.school === b.school &&
             a.grade  === b.grade  &&
             a.class  === b.class  &&
             (a.grade < 2 || (a.course||"") === (b.course||""));
    }

    function isBunriUnitForLesson(l){
      const unit = getUnitLessons(l);
      if (!unit.length) return false;
      if (l.grade < 2 || l.school !== "HS") return false;

      const sameClassLessons = unit.filter(x =>
        x.grade === l.grade &&
        x.class === l.class
      );
      if (!sameClassLessons.length) return false;

      let hasBun = false;
      let hasRi  = false;
      sameClassLessons.forEach(x => {
        if (x.course === "文") hasBun = true;
        else if (x.course === "理") hasRi = true;
      });
      return hasBun && hasRi;
    }

    function rebuildLessons(){
      lessons = lessonsHS.concat(lessonsJH);

      signatureIndex = new Map();
      unitIndex      = new Map();
      scheduleState  = new Map();

      lessons.forEach(l => {
        const sKey = signatureKey(l);
        let sEntry = signatureIndex.get(sKey);
        if(!sEntry){
          sEntry = { lesson: l, teachers: new Set() };
          signatureIndex.set(sKey, sEntry);
        }
        if(l.teacher) sEntry.teachers.add(l.teacher);

        const uKey = unitKeyForTeacherSlot(l);
        let uArr = unitIndex.get(uKey);
        if(!uArr){
          uArr = [];
          unitIndex.set(uKey, uArr);
        }
        uArr.push(l);

        if(!scheduleState.has(l.teacher)) scheduleState.set(l.teacher, new Map());
        const dayMap = scheduleState.get(l.teacher);
        if(!dayMap.has(l.day)) dayMap.set(l.day, new Set());
        dayMap.get(l.day).add(l.period);
      });

      const uniqTeachers = Array.from(new Set(lessons.map(l=>l.teacher))).filter(Boolean);
      const sorted = uniqTeachers.sort((a,b)=>{
        const A = isParttimeTeacher(a), B = isParttimeTeacher(b);
        if(A && !B) return 1;
        if(!A && B) return -1;
        return collatorJA.compare(a,b);
      });
      enableTeacherSelects(sorted);

      // クラス別時間割の候補も更新
      rebuildClassTtOptions();
    }

    // ===== クラス別時間割：クラス一覧構築 =====
    function rebuildClassTtOptions(){
      classTtOptions = [];
      const map = new Map(); // key -> label

      lessons.forEach(l => {
        if (Number.isNaN(l.grade) || Number.isNaN(l.class)) return;
        const key = (l.school || "") + "|" + l.grade + "|" + l.class;
        if (map.has(key)) return;

        const schoolLabel = (l.school === "HS") ? "【高】" : (l.school === "JH" ? "【中】" : "");
        const label = schoolLabel + l.grade + "年" + l.class + "組";
        map.set(key, label);
      });

      const keys = Array.from(map.keys()).sort((a, b) => {
        const [sa, ga, ca] = a.split("|");
        const [sb, gb, cb] = b.split("|");
        if (sa !== sb) return sa.localeCompare(sb);
        const gaNum = parseInt(ga, 10);
        const gbNum = parseInt(gb, 10);
        if (gaNum !== gbNum) return gaNum - gbNum;
        const caNum = parseInt(ca, 10);
        const cbNum = parseInt(cb, 10);
        return caNum - cbNum;
      });

      classTtOptions = keys.map(key => ({
        key: key,
        label: map.get(key)
      }));

      classTtSelect.innerHTML = "";
      if (!classTtOptions.length) {
        const op = document.createElement('option');
        op.value = "";
        op.textContent = "授業CSVを読み込むとクラス一覧が表示されます";
        classTtSelect.appendChild(op);
        classTtSelect.disabled = true;
        classTtDownloadBtn.disabled = true;
        classTtTableContainer.innerHTML = "";
        currentClassTtLabel = "";
        return;
      }

      const op0 = document.createElement('option');
      op0.value = "";
      op0.textContent = "クラスを選択";
      classTtSelect.appendChild(op0);

      classTtOptions.forEach(opt => {
        const op = document.createElement('option');
        op.value = opt.key;
        op.textContent = opt.label;
        classTtSelect.appendChild(op);
      });

      classTtSelect.disabled = false;
      classTtDownloadBtn.disabled = true;
      classTtTableContainer.innerHTML = "";
      currentClassTtLabel = "";
    }

    function renderClassTimetable(){
      const key = classTtSelect.value;
      if (!key) {
        classTtTableContainer.innerHTML = "";
        classTtDownloadBtn.disabled = true;
        currentClassTtLabel = "";
        return;
      }

      const parts = key.split("|");
      const school = parts[0] || "";
      const grade = parseInt(parts[1], 10);
      const cls = parseInt(parts[2], 10);

      const rowsForClass = lessons.filter(l =>
        l.school === school &&
        l.grade === grade &&
        l.class === cls
      );

      if (!rowsForClass.length) {
        classTtTableContainer.innerHTML = "<p class=\"muted\">このクラスの授業データがありません</p>";
        classTtDownloadBtn.disabled = true;
        currentClassTtLabel = "";
        return;
      }

      let html = "<table class=\"class-tt-table\"><thead><tr><th>限/曜</th>";
      DAYS_FOR_TT.forEach(d => {
        const ja = DAY_JA_OUT[d] || d;
        html += "<th>" + ja + "</th>";
      });
      html += "</tr></thead><tbody>";

      PERIODS_FOR_TT.forEach(p => {
        html += "<tr><th>" + p + "限</th>";

        DAYS_FOR_TT.forEach(d => {
          const cellLessons = rowsForClass.filter(l => l.day === d && l.period === p);

          if (!cellLessons.length) {
            html += "<td></td>";
            return;
          }

          // 1段目：科目（文・理は科目名に(文)/(理)を付与）
          const subjLabels = [];
          cellLessons.forEach(l => {
            const subjBase = (l.subject || "").trim();
            let label = subjBase;
            if (l.course === "文") {
              label = subjBase + "(文)";
            } else if (l.course === "理") {
              label = subjBase + "(理)";
            }
            if (label && subjLabels.indexOf(label) === -1) {
              subjLabels.push(label);
            }
          });

          // 2段目：担当者名
          const teacherSet = new Set();
          cellLessons.forEach(l => {
            if (l.teacher) teacherSet.add(l.teacher);
          });
          const teachers = Array.from(teacherSet).sort((a, b) => collatorJA.compare(a, b));

          const subjText = subjLabels.join(" / ");
          const teacherText = teachers.join(" / ");

          html += "<td>";
          html += "<span class=\"class-tt-subject\">" + subjText + "</span>";
          html += "<span class=\"class-tt-teacher\">" + teacherText + "</span>";
          html += "</td>";
        });

        html += "</tr>";
      });

      html += "</tbody></table>";

      const labelText = classTtSelect.options[classTtSelect.selectedIndex].textContent || "クラス時間割";
      currentClassTtLabel = labelText;

      classTtTableContainer.innerHTML =
        "<div class=\"class-tt-header\">" + labelText + " の時間割</div>" + html;

      classTtDownloadBtn.disabled = false;
    }

    classTtSelect.addEventListener('change', renderClassTimetable);

    // 画像としてダウンロード
    classTtDownloadBtn.addEventListener('click', () => {
      if (!currentClassTtLabel) return;
      if (!window.html2canvas) {
        alert("画像出力用ライブラリ（html2canvas）の読み込みに失敗しました。");
        return;
      }

      // 表とクラス名ヘッダーを含むコンテナをキャプチャ
      html2canvas(classTtTableContainer).then(canvas => {
        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = currentClassTtLabel.replace(/[\\\/:*?"<>|]/g, "_") + ".png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    });

      if (keepValue && filtered.indexOf(keepValue) !== -1) sel.value = keepValue;

    function teacherHasSlot(t,d,p){
      const dayMap = scheduleState.get(t);
      if(!dayMap) return false;
      const set = dayMap.get(d);
      if(!set) return false;
      return set.has(p);
    }
    function teacherHasSlotMany(names,d,p){
      return names.some(n => teacherHasSlot(n,d,p));
    }
    function formatSlot(day,period){
      const d = DAY_JA_OUT[day] || day;
      return d + period + "限";
    }

    function cloneScheduleState(state){
      const copy = new Map();
      for (const [t, dayMap] of state.entries()) {
        const newDayMap = new Map();
        for (const [d, periods] of dayMap.entries()) {
          newDayMap.set(d, new Set(periods));
        }
        copy.set(t, newDayMap);
      }
      return copy;
    }

    function validateOperations(operations, baseState, options){
      const opts = options || {};
      const allowTraining = !!opts.allowTraining;
      const state = cloneScheduleState(baseState);

      for(let idx=0; idx<operations.length; idx++){
        const op = operations[idx];
        const teacher = op.teacher;
        const dayFrom = op.dayFrom;
        const dayTo = op.dayTo;
        const pf = op.periodFrom;
        const pt = op.periodTo;

        if(!teacher || !dayFrom || !dayTo || !pf || !pt) return false;

        const dayMap = state.get(teacher);
        if(!dayMap) return false;
        const fromSet = dayMap.get(dayFrom);
        if(!fromSet || !fromSet.has(pf)) return false;

        const toSet = dayMap.get(dayTo) || new Set();
        if(toSet.has(pt)) return false;

        if(!allowTraining && hasAnyEvent(teacher, dayTo, pt)) return false;

        fromSet.delete(pf);
        dayMap.set(dayFrom, fromSet);
        toSet.add(pt);
        dayMap.set(dayTo, toSet);
        state.set(teacher, dayMap);
      }

      return true;
    }

    function buildRotate3OperationsPattern(lA, lB, lC, groupA, groupB, groupC, patternId){
      const ops = [];
      if (patternId === 1) {
        groupA.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lA.day, periodFrom:lA.period, dayTo:lB.day, periodTo:lB.period });
        });
        groupB.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lB.day, periodFrom:lB.period, dayTo:lC.day, periodTo:lC.period });
        });
        groupC.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lC.day, periodFrom:lC.period, dayTo:lA.day, periodTo:lA.period });
        });
      } else if (patternId === 2) {
        groupA.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lA.day, periodFrom:lA.period, dayTo:lC.day, periodTo:lC.period });
        });
        groupC.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lC.day, periodFrom:lC.period, dayTo:lB.day, periodTo:lB.period });
        });
        groupB.forEach(t=>{
          ops.push({ teacher:t, dayFrom:lB.day, periodFrom:lB.period, dayTo:lA.day, periodTo:lA.period });
        });
      }
      return ops;
    }

    function buildTeacherTimetableData(teacherNames){
      const map = new Map();
      if (!teacherNames || !teacherNames.length) return map;
      const nameSet = new Set(teacherNames);
      lessons.forEach(l => {
        if (!nameSet.has(l.teacher)) return;
        const d = l.day;
        const p = l.period;
        if (!DAYS_FOR_TT.includes(d)) return;
        if (!PERIODS_FOR_TT.includes(p)) return;
        if (!map.has(d)) map.set(d, new Map());
        const pMap = map.get(d);
        if (!pMap.has(p)) pMap.set(p, []);
        pMap.get(p).push(l);
      });
      return map;
    }

    function buildTeacherTimetableHTML(teacherNames, options){
      const opts = options || {};
      const clickableEmpty = !!opts.clickableEmpty;

      if (!teacherNames || !teacherNames.length) return "";
      const data = buildTeacherTimetableData(teacherNames);

      let hasAny = false;
      if (data.size) {
        hasAny = true;
      } else {
        outer:
        for (let i=0; i<teacherNames.length; i++) {
          const tName = teacherNames[i];
          for (let j=0; j<DAYS_FOR_TT.length; j++) {
            const d = DAYS_FOR_TT[j];
            for (let k=0; k<PERIODS_FOR_TT.length; k++) {
              const p = PERIODS_FOR_TT[k];
              if (hasAnyEvent(tName, d, p)) {
                hasAny = true;
                break outer;
              }
            }
          }
        }
      }

      if (!hasAny) {
        return "<h3>" + teacherNames.join("・") + " の時間割</h3><p class=\"muted\">授業・研修データがありません</p>";
      }

      let html = "<h3>" + teacherNames.join("・") + " の時間割</h3>";
      html += "<table class=\"tt-table\"><thead><tr><th>限/曜</th>";
      DAYS_FOR_TT.forEach(d => {
        const ja = DAY_JA_OUT[d] || d;
        html += "<th>" + ja + "</th>";
      });
      html += "</tr></thead><tbody>";

      PERIODS_FOR_TT.forEach(p => {
        html += "<tr><th>" + p + "限</th>";
        DAYS_FOR_TT.forEach(d => {
          const dayMap = data.get(d);
          const list = dayMap ? (dayMap.get(p) || []) : [];

          const lessonLines = list.map(l => renderLessonShortForTimetable(l));

          const trainingSet = new Set();
          teacherNames.forEach(tName => {
            const label = getTrainingDetailLabel(tName, d, p);
            if (label) trainingSet.add(label);
          });
          const trainingLines = Array.from(trainingSet);

          const isEmpty = (!lessonLines.length && !trainingLines.length);

          if (isEmpty) {
            // ★追加：空きコマをクリック可能に（教員A時間割のみで使う）
            if (clickableEmpty) {
              html += "<td class=\"tt-empty\" data-ttday=\"" + d + "\" data-ttperiod=\"" + p + "\" title=\"空きコマ（クリックで振替候補表示）\"></td>";
            } else {
              html += "<td></td>";
            }
          } else {
            const lessonHtml = lessonLines
              .map(function(s){ return "<span class=\"tt-lesson\">" + s + "</span>"; })
              .join("<br>");
            const trainingHtml = trainingLines
              .map(function(s){ return "<span class=\"tt-training\">" + s + "</span>"; })
              .join("<br>");
            const combined = [lessonHtml, trainingHtml].filter(Boolean).join("<br>");
            html += "<td>" + combined + "</td>";
          }
        });
        html += "</tr>";
      });

      html += "</tbody></table>";
      return html;
    }

    // 「今の選択状態における自分の授業ユニット一覧（代表行）」を取得
    function getMyLessonUnitRepsForCurrentSelection(){
      const a = teacherSelectA.value;
      const b = teacherSelectB.value;
      const c = teacherSelectC.value;

      const namesSelf = [];
      if (a) namesSelf.push(a);
      if (b) namesSelf.push(b);
      if (c) namesSelf.push(c);
      const useJoint = namesSelf.length > 1;

      if (!a) return [];

      let list = [];

      if(!useJoint){
        const all = lessons.filter(l => {
          if (l.teacher !== a) return false;
          const teachers = getAllTeachersForLesson(l);
          return teachers.length === 1 && teachers[0] === a;
        });
        const unitSeen = new Set();
        all.forEach(l=>{
          const key = unitKeyForTeacherSlot(l);
          if(unitSeen.has(key)) return;
          unitSeen.add(key);
          list.push(l);
        });
      } else {
        const jointSet = new Set();
        signatureIndex.forEach((entry, key)=>{
          const teachersArr = Array.from(entry.teachers);
          if(namesSelf.every(tName => teachersArr.indexOf(tName) !== -1)){
            jointSet.add(key);
          }
        });

        const all2 = lessons.filter(l => l.teacher===a && jointSet.has(signatureKey(l)));
        const unitSeen2 = new Set();
        all2.forEach(l=>{
          const key = unitKeyForTeacherSlot(l);
          if(unitSeen2.has(key)) return;
          unitSeen2.add(key);
          list.push(l);
        });
      }

      // 表示順を安定化（日→限→学年→組→科目）
      list.sort((x,y)=>{
        const dx = DAY_ORDER[x.day] || 99;
        const dy = DAY_ORDER[y.day] || 99;
        if (dx !== dy) return dx - dy;
        if (x.period !== y.period) return x.period - y.period;
        if (x.grade !== y.grade) return x.grade - y.grade;
        if (x.class !== y.class) return x.class - y.class;
        return collatorJA.compare((x.subject||""),(y.subject||""));
      });

      return list;
    }

    // 直接移動できるか（教師側空き＋研修なし＋クラス側でそのコマが空いている）
    function canMoveMyLessonToSlot(myLessonRep, targetDay, targetPeriod){
      const myUnitRows = getUnitLessons(myLessonRep);
      if (!myUnitRows.length) {
        return { ok:false, reason:"授業ユニット不明" };
      }

      // 同コマは意味がない
      if (myLessonRep.day === targetDay && myLessonRep.period === targetPeriod) {
        return { ok:false, reason:"同じコマ" };
      }

      const selfNames = getSelfNamesForMove();
      const useJoint = selfNames.length > 1;
      const myTeachers = useJoint ? Array.from(new Set(selfNames)) : getAllTeachersForLesson(myLessonRep);
      if (!myTeachers.length) {
        return { ok:false, reason:"担当者不明" };
      }

      // 教師側：空き＋研修/会議なし
      for (const t of myTeachers) {
        if (teacherHasSlot(t, targetDay, targetPeriod)) {
          return { ok:false, reason:"教師側が授業で埋まっている" };
        }
        if (hasAnyEvent(t, targetDay, targetPeriod)) {
          return { ok:false, reason:"教師側に研修/会議がある" };
        }
      }

      // クラス側：同じクラス(文理含)の授業が既にあるなら直接移動不可（＝交換が必要）
      const hasClassBlocker = lessons.some(l =>
        l.day === targetDay &&
        l.period === targetPeriod &&
        myUnitRows.some(row => sameClassAndCourse(row, l))
      );
      if (hasClassBlocker) {
        return { ok:false, reason:"そのクラスは別授業が入っている（交換が必要）" };
      }

      return { ok:true, reason:"" };
    }

    // swap候補（交換すればターゲットに入れられる）探索
    function findSwapCandidatesForLessonToSlot(myLessonRep, targetDay, targetPeriod){
      const a = teacherSelectA.value;
      if (!a) return [];

      const selfNames = getSelfNamesForMove();
      const useJoint = selfNames.length > 1;
      const myTeachers = useJoint ? Array.from(new Set(selfNames)) : getAllTeachersForLesson(myLessonRep);
      if (!myTeachers.length) return [];

      const myUnitRows = getUnitLessons(myLessonRep);
      if (!myUnitRows.length) return [];

      // ターゲット教師側が空いている＆研修なし（安全側）
      for (const t of myTeachers) {
        if (teacherHasSlot(t, targetDay, targetPeriod)) return [];
        if (hasAnyEvent(t, targetDay, targetPeriod)) return [];
      }

      // ターゲット側でクラス衝突している授業（blocker）を抽出
      const blockers = lessons.filter(l =>
        l.day === targetDay &&
        l.period === targetPeriod &&
        myUnitRows.some(row => sameClassAndCourse(row, l))
      );
      if (!blockers.length) return [];

      // ★簡易制限：blockerが1 signature（=1ユニット）にまとまっている場合のみ
      const sigSet = new Set(blockers.map(l => signatureKey(l)));
      if (sigSet.size !== 1) return [];

      const blockSig = Array.from(sigSet)[0];
      const blockRep = blockers.find(l => signatureKey(l) === blockSig) || blockers[0];

      // 合体授業（複数クラス）対策：myとblockのクラス集合が一致すること
      const blockUnitRows = getUnitLessons(blockRep);

      function classKey(x){
        return (x.school||"") + "|" + x.grade + "|" + x.class + "|" + (x.grade < 2 ? "" : (x.course||""));
      }
      const myKeys = new Set(myUnitRows.map(classKey));
      const blKeys = new Set(blockUnitRows.map(classKey));
      if (myKeys.size !== blKeys.size) return [];
      for (const k of myKeys) {
        if (!blKeys.has(k)) return [];
      }

      const blockTeachers = getAllTeachersForLesson(blockRep);
      if (!blockTeachers.length) return [];

      // 相手（blocker）担当者が「自分の元コマ」に入れるか（空き＋研修なし）
      for (const t of blockTeachers) {
        if (teacherHasSlot(t, myLessonRep.day, myLessonRep.period)) return [];
        if (hasAnyEvent(t, myLessonRep.day, myLessonRep.period)) return [];
      }

      // swapの教師操作列
      const ops = [];

      // 自分：元→ターゲット
      myTeachers.forEach(t => {
        ops.push({
          teacher: t,
          dayFrom: myLessonRep.day,
          periodFrom: myLessonRep.period,
          dayTo: targetDay,
          periodTo: targetPeriod
        });
      });

      // 相手：ターゲット→元
      blockTeachers.forEach(t => {
        ops.push({
          teacher: t,
          dayFrom: targetDay,
          periodFrom: targetPeriod,
          dayTo: myLessonRep.day,
          periodTo: myLessonRep.period
        });
      });

      const ok = validateOperations(ops, scheduleState, { allowTraining:false });
      if (!ok) return [];

      return [{
        myLesson: myLessonRep,
        blockLesson: blockRep,
        myTeachers: myTeachers,
        blockTeachers: blockTeachers
      }];
    }

    function renderMoveCandidates(targetDay, targetPeriod){
      const a = teacherSelectA.value;
      if (!a) {
        alert("教員Aを選択してください。");
        return;
      }

      // ターゲットは「教員Aの空きコマ」前提だが、念のため空きか確認
      if (teacherHasSlot(a, targetDay, targetPeriod) || hasAnyEvent(a, targetDay, targetPeriod)) {
        alert("そのコマは教員Aの空きコマではありません（授業/研修が入っています）。");
        return;
      }

      const myLessons = getMyLessonUnitRepsForCurrentSelection();
      if (!myLessons.length) {
        movePanelTitle.textContent = "振替候補（" + formatSlot(targetDay, targetPeriod) + "）";
        movePanelBody.innerHTML = "<p class=\"muted\">自分の授業候補がありません（教員A/B/Cの選択状態を確認してください）。</p>";
        movePanel.classList.remove('hidden');
        return;
      }

      const okList = [];
      const swapList = [];
      const ngList = [];

      for (let i=0; i<myLessons.length; i++){
        const l = myLessons[i];
        const judge = canMoveMyLessonToSlot(l, targetDay, targetPeriod);
        if (judge.ok) {
          okList.push(l);
          continue;
        }
        const swaps = findSwapCandidatesForLessonToSlot(l, targetDay, targetPeriod);
        if (swaps.length) {
          swapList.push(...swaps);

          ngList.push({ lesson:l, reason:judge.reason });

      movePanelTitle.textContent = "振替候補（" + formatSlot(targetDay, targetPeriod) + "）";

        html += "<p class=\"muted\">該当なし</p>";
      } else {
        html += "<table><thead><tr>" +
          "<th>自分の授業（元）</th>" +
          "<th class=\"nowrap\">元のコマ</th>" +
          "<th>相手の授業（ターゲットに入っている授業）</th>" +
          "<th class=\"nowrap\">相手の移動</th>" +
          "<th>担当者</th>" +
          "</tr></thead><tbody>";

        swapList.forEach(x => {
          const my = x.myLesson;
          const bl = x.blockLesson;

          const myFrom = formatSlot(my.day, my.period);
          const blFrom = formatSlot(bl.day, bl.period); // = target
          const blTo   = formatSlot(my.day, my.period); // 相手は自分の元へ

          const myTeachersLabel = (x.myTeachers || []).join("・");
          const blTeachersLabel = (x.blockTeachers || []).join("・");

          html += "<tr>" +
            "<td>" + renderLessonTextForResult(my) + "</td>" +

            "<td>" + "自分：" + myTeachersLabel + "<br>相手：" + blTeachersLabel + "</td>" +

        });

      }

      // 参考：不可（理由）
      html += "<h3 style=\"margin:14px 0 6px; font-size:0.95rem;\">参考：このコマに入れられない授業（理由）</h3>";
      if (!ngList.length) {
        html += "<p class=\"muted\">（すべて候補化されています）</p>";
      } else {
        html += "<table><thead><tr><th>授業</th><th>理由</th></tr></thead><tbody>";
        ngList.slice(0, 80).forEach(x=>{
          html += "<tr><td>" + renderLessonTextForResult(x.lesson) + "</td><td>" + (x.reason||"") + "</td></tr>";
        });

        if (ngList.length > 80) {
          html += "<p class=\"muted\">※多いため一部のみ表示（" + ngList.length + "件中 80件）</p>";
        }
      }

      movePanelBody.innerHTML = html;

    }
