    lessonSelect.addEventListener('change', e=>{
      results1to1Div.innerHTML = "";
      results3wayDiv.innerHTML = "";
      timetableTooltip.classList.add('hidden');
      pinnedTeachers = null;

      const unitKey = e.target.value;
      if(!unitKey) return;

      const myUnitLessons = unitIndex.get(unitKey) || [];
      if(!myUnitLessons.length) return;

      const me      = myUnitLessons[0];
      const a = teacherSelectA.value;
      const b = teacherSelectB.value;
      const c = teacherSelectC.value;

      const namesSelf = [];
      if(a) namesSelf.push(a);
      if(b) namesSelf.push(b);
      if(c) namesSelf.push(c);
      const useJoint = namesSelf.length > 1;

      const myDay   = me.day;
      const myPeriod= me.period;

      const myClassKeys   = new Set(myUnitLessons.map(function(l){ return l.grade + "-" + l.class; }));
      const myMergeCount  = myClassKeys.size;

      const currentOriginText = stripHtmlTags(renderLessonTextForDropdown(me));

      const poolBase = lessons.filter(o => {
        const otherUnitLessons  = getUnitLessons(o);
        const otherClassKeysArr = otherUnitLessons.map(function(l){ return l.grade + "-" + l.class; });
        const otherMergeCount   = otherClassKeysArr.length;

        if (myMergeCount > 1) {
          if (otherMergeCount !== myMergeCount) return false;
          const otherSet = new Set(otherClassKeysArr);
          for (const k of myClassKeys) {
            if (!otherSet.has(k)) return false;
          }
        } else {
          if (otherMergeCount > 1) return false;
        }

        if(!useJoint) {
          return o.teacher !== a && sameClassAndCourse(me, o);
        }
        return namesSelf.indexOf(o.teacher) === -1 && sameClassAndCourse(me, o);
      });

      const c1raw = poolBase
        .filter(o=>{
          const selfFree = !useJoint
            ? !teacherHasSlot(a, o.day, o.period)
            : !teacherHasSlotMany(namesSelf, o.day, o.period);

          const oppAllTeachers = getAllTeachersForLesson(o);
          const otherFree = !oppAllTeachers.some(function(t){ return teacherHasSlot(t, myDay, myPeriod); });

          return selfFree && otherFree;
        })
        .map(o=>{
          const oppHasEventAtMy = hasAnyEvent(o.teacher, myDay, myPeriod);

          const aHasEventAtOpp  = hasAnyEvent(a, o.day, o.period);
          const bHasEventAtOpp  = b ? hasAnyEvent(b, o.day, o.period) : false;
          const cHasEventAtOpp  = c ? hasAnyEvent(c, o.day, o.period) : false;

          const trainingDetailsSet = new Set();

          const d1 = getTrainingDetailLabel(o.teacher, myDay, myPeriod);
          if(d1) trainingDetailsSet.add(d1);

          const d2 = getTrainingDetailLabel(a, o.day, o.period);
          if(d2) trainingDetailsSet.add(d2);
          if(b){
            const d3 = getTrainingDetailLabel(b, o.day, o.period);
            if(d3) trainingDetailsSet.add(d3);
          }
          if(c){
            const d4 = getTrainingDetailLabel(c, o.day, o.period);
            if(d4) trainingDetailsSet.add(d4);
          }

          const trainingDetails = Array.from(trainingDetailsSet);

          const selfTraining  = aHasEventAtOpp;
          const otherTraining = oppHasEventAtMy || bHasEventAtOpp || cHasEventAtOpp;
          const parttime      = isParttimeTeacher(o.teacher);
          const trainingFlag  = selfTraining || otherTraining;

          return {
            other          : o,
            trainingDetails: trainingDetails,
            selfTraining   : selfTraining,
            otherTraining  : otherTraining,
            parttime       : parttime,
            trainingFlag   : trainingFlag,
            priority       : getPriority(o, me)
          };
        });

      const grouped = new Map();
      c1raw.forEach(cand=>{
        const key = signatureKey(cand.other);
        if(!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(cand);
      });

      const c1 = [];
      grouped.forEach(list=>{
        const repLesson   = list[0].other;
        const teachersAll = getAllTeachersForLesson(repLesson);
        const canonical   = teachersAll[0] || repLesson.teacher;
        const base        = list.find(function(c){ return c.other.teacher===canonical; }) || list[0];

        const trainingDetailsSet = new Set();
        list.forEach(function(c){
          c.trainingDetails.forEach(function(t){ trainingDetailsSet.add(t); });
        });
        teachersAll.forEach(function(t){
          const label = getTrainingDetailLabel(t, me.day, myPeriod);
          if(label) trainingDetailsSet.add(label);
        });

        const trainingDetails = Array.from(trainingDetailsSet);
        const selfTraining    = list.some(function(c){ return c.selfTraining; });

        let otherTraining = list.some(function(c){ return c.otherTraining; });
        if(!otherTraining){
          for(let i=0;i<teachersAll.length;i++){
            const t = teachersAll[i];
            if(hasAnyEvent(t, me.day, myPeriod)){
              otherTraining = true;
              break;
            }
          }
        }

        let parttime = list.some(function(c){ return c.parttime; });
        if(!parttime){
          for(let i=0;i<teachersAll.length;i++){
            const t = teachersAll[i];
            if(isParttimeTeacher(t)){
              parttime = true;
              break;
            }
          }
        }

        const trainingFlag = selfTraining || otherTraining;
        const priority     = Math.max.apply(null, list.map(function(c){ return c.priority; }));
        const otherLesson  = Object.assign({}, base.other, { teacher: canonical });
        const isJoint      = isJointLessonForTeacher(repLesson);

        c1.push({
          other        : otherLesson,
          teachersAll  : teachersAll,
          trainingDetails: trainingDetails,
          selfTraining : selfTraining,
          otherTraining: otherTraining,
          parttime     : parttime,
          trainingFlag : trainingFlag,
          joint        : isJoint,
          priority     : priority
        });
      });

      function oneToOneCategory(cand){
        if(cand.parttime) return 3;
        if(!cand.trainingFlag){
          return cand.joint ? 1 : 0;
        }
        return 2;
      }

      c1.sort(function(x,y){
        const cx = oneToOneCategory(x);
        const cy = oneToOneCategory(y);
        if (cx !== cy) return cx - cy;

        const dx = DAY_ORDER[x.other.day] || 99;
        const dy = DAY_ORDER[y.other.day] || 99;
        if (dx !== dy) return dx - dy;

        if (x.other.period !== y.other.period) return x.other.period - y.other.period;

        const nameX = x.teachersAll && x.teachersAll.length ? x.teachersAll.join('・') : x.other.teacher;
        const nameY = y.teachersAll && y.teachersAll.length ? y.teachersAll.join('・') : y.other.teacher;
        return collatorJA.compare(nameX, nameY);
      });

      const h2a = document.createElement('h2');
      h2a.textContent = useJoint ? "■ A⇔B 候補（合同）" : "■ A⇔B 候補";
      results1to1Div.appendChild(h2a);

      if(!c1.length){
        results1to1Div.insertAdjacentHTML("beforeend","<p class=\"muted\">候補はありません</p>");
      }else{
        const tbl = document.createElement('table');
        tbl.innerHTML = "<thead><tr>" +
          "<th class=\"print-checkbox-col\">印刷</th><th>交換相手</th><th>交換先授業</th><th>あなたの授業</th>" +
          "<th class=\"nowrap\">予定</th><th class=\"nowrap\">非常勤</th>" +
        "</tr></thead>";
        const tb = document.createElement('tbody');

        c1.forEach(cand=>{
          const o  = cand.other;
          const tr = document.createElement('tr');
          
          const teacherLabel = cand.teachersAll && cand.teachersAll.length ? cand.teachersAll.join('・') : o.teacher;
          
          const pId = `1to1_${me.day}${me.period}_${o.teacher}_${o.day}${o.period}`;
          
          const fullOppLessonText = stripHtmlTags(renderLessonTextForResult(o));
          const myMoveTxt = `${stripHtmlTags(renderMyLessonText(me))} ➔ ${formatSlot(o.day, o.period)}`;
          const oppMoveTxt = `${fullOppLessonText} ➔ ${formatSlot(me.day, me.period)}`;

          const tdCb = document.createElement('td');
          tdCb.className = 'print-checkbox-col';

          const encOrigin = escapeHtmlAttr(currentOriginText);
          const encMyMove = escapeHtmlAttr(myMoveTxt);
          const encOppMove = escapeHtmlAttr(oppMoveTxt);
          const encOppName = escapeHtmlAttr(teacherLabel);
          const encOriginTeacher = escapeHtmlAttr(a);

          tdCb.innerHTML = `<input type="checkbox" class="print-row-cb" data-print-id="${pId}" data-origin-lesson="${encOrigin}" data-my-move="${encMyMove}" data-opp-move="${encOppMove}" data-opp-names="${encOppName}" data-origin-teacher="${encOriginTeacher}">`;

          const myTitle = renderMyLessonText(me);
          const trainingText = cand.trainingDetails.length ? cand.trainingDetails.join("<br>") : "";

          const tdName = document.createElement('td');
          const spanName = document.createElement('span');
          spanName.textContent = teacherLabel;
          spanName.className = 'teacher-name';
          spanName.dataset.teachers = (cand.teachersAll && cand.teachersAll.length) ? cand.teachersAll.join('|') : o.teacher;
          tdName.appendChild(spanName);

          const tdOther = document.createElement('td');
          tdOther.innerHTML = renderLessonTextForResult(o);

          const tdMine = document.createElement('td');
          tdMine.innerHTML = myTitle;

          const tdTrain = document.createElement('td');
          tdTrain.style.textAlign = 'center';
          tdTrain.innerHTML = trainingText;

          const tdPart = document.createElement('td');
          tdPart.style.textAlign = 'center';
          tdPart.textContent = cand.parttime ? "〇" : "";

          if(cand.parttime){
            tr.classList.add("parttime-row");
          } else if(cand.selfTraining || cand.otherTraining){
            tr.classList.add("training-conflict");
          }

          tr.appendChild(tdCb);
          tr.appendChild(tdName);
          tr.appendChild(tdOther);
          tr.appendChild(tdMine);
          tr.appendChild(tdTrain);
          tr.appendChild(tdPart);

          tb.appendChild(tr);
        });
        tbl.appendChild(tb);
        results1to1Div.appendChild(tbl);
      }

      // --- 二段階交換 ---
      const chainCandidates = [];
      const normal1to1Count = c1.filter(function(c){ return !c.trainingFlag && !c.parttime; }).length;

      if (!useJoint && a && normal1to1Count <= 3) {
        const teacherA   = a;
        const teachersMe = getAllTeachersForLesson(me);

        if (teachersMe.length === 1 && teachersMe[0] === teacherA) {
          for (let i = 0; i < poolBase.length; i++) {
            const B1 = poolBase[i];
            if (B1.teacher === teacherA) continue;

            const teachersB = getAllTeachersForLesson(B1);
            if (teachersB.length !== 1) continue;
            const teacherB = teachersB[0];

            const directSelfFree  = !teacherHasSlot(teacherA, B1.day, B1.period);
            const directOtherFree = !teacherHasSlot(teacherB, myDay, myPeriod);
            if (directSelfFree && directOtherFree) continue;

            const blockers = [];
            if (!directSelfFree) {
              lessons.forEach(l => {
                if (l.teacher === teacherA &&
                    l.day === B1.day &&
                    l.period === B1.period) {
                  blockers.push(l);
                }
              });
            }
            if (!directOtherFree) {
              lessons.forEach(l => {
                if (l.teacher === teacherB &&
                    l.day === myDay &&
                    l.period === myPeriod) {
                  blockers.push(l);
                }
              });
            }
            if (!blockers.length) continue;

            for (let bIdx = 0; bIdx < blockers.length; bIdx++) {
              const blockLesson  = blockers[bIdx];
              const teacherBlock = blockLesson.teacher;

              const partners = lessons.filter(o => {
                if (o === blockLesson) return false;
                if (o.teacher === teacherBlock) return false;
                if (!sameClassAndCourse(blockLesson, o)) return false;
                if (o.day === blockLesson.day && o.period === blockLesson.period) return false;
                return true;
              });

              for (let k = 0; k < partners.length; k++) {
                const partner       = partners[k];
                const tPartnerArr   = getAllTeachersForLesson(partner);
                if (tPartnerArr.length !== 1) continue;
                const teacherPartner = tPartnerArr[0];

                const ops = [];

                ops.push({ teacher: teacherBlock, dayFrom: blockLesson.day, periodFrom: blockLesson.period, dayTo: partner.day, periodTo: partner.period });
                ops.push({ teacher: teacherPartner, dayFrom: partner.day, periodFrom: partner.period, dayTo: blockLesson.day, periodTo: blockLesson.period });
                ops.push({ teacher: teacherA, dayFrom: me.day, periodFrom: myPeriod, dayTo: B1.day, periodTo: B1.period });
                ops.push({ teacher: teacherB, dayFrom: B1.day, periodFrom: B1.period, dayTo: me.day, periodTo: myPeriod });

                let invalidChain = false;

                const chainTeachers = [teacherA, teacherB, teacherBlock, teacherPartner];
                for (let i2=0; i2<chainTeachers.length; i2++) {
                  const tName = chainTeachers[i2];
                  if (isParttimeTeacher(tName)) {
                    invalidChain = true;
                    break;
                  }
                }

                if (!invalidChain) {
                  for (let j2=0; j2<ops.length; j2++) {
                    const op = ops[j2];
                    if (hasAnyEvent(op.teacher, op.dayFrom, op.periodFrom) ||
                        hasAnyEvent(op.teacher, op.dayTo,   op.periodTo)) {
                      invalidChain = true;
                      break;
                    }
                  }
                }

                if (invalidChain) continue;

                if (validateOperations(ops, scheduleState)) {
                  chainCandidates.push({
                    mainB        : B1,
                    blockLesson  : blockLesson,
                    partner      : partner,
                    teacherA     : teacherA,
                    teacherB     : teacherB,
                    teacherBlock : teacherBlock,
                    teacherPartner: teacherPartner
                  });
                }
              }
            }
          }
        }
      }

      // --- 三者ローテ ---
      const h2b = document.createElement('h2');
      h2b.textContent = "■ A⇔B⇔C候補";
      results3wayDiv.appendChild(h2b);

      const note = document.createElement('p');
      note.className = 'muted';
      let filteredOut = 0;
      const c3        = [];
      const namesSelfFor3 = namesSelf.length ? namesSelf : [a];
      const baseState = scheduleState;

      for(let i=0;i<poolBase.length;i++){
        const lB = poolBase[i];
        for(let j=i+1;j<poolBase.length;j++){
          const lC = poolBase[j];
          if(lB.teacher === lC.teacher) continue;
          if(lB.day===lC.day && lB.period===lC.period) continue;

          const teachersA = getAllTeachersForLesson(me);
          const teachersB = getAllTeachersForLesson(lB);
          const teachersC = getAllTeachersForLesson(lC);

          const groupA = Array.from(new Set(namesSelfFor3.concat(teachersA)));
          const groupB = teachersB.slice();
          const groupC = teachersC.slice();

          const allTeachersTriple = Array.from(new Set(
            groupA.concat(groupB).concat(groupC)
          ));

          const hasParttimeTriple = allTeachersTriple.some(function(t){ return isParttimeTeacher(t); });
          const hasTrainingAt = function(day, period){
            return allTeachersTriple.some(function(t){ return hasAnyEvent(t, day, period); });
          };

          const trainAtA = hasTrainingAt(myDay, myPeriod);
          const trainAtB = hasTrainingAt(lB.day, lB.period);
          const trainAtC = hasTrainingAt(lC.day, lC.period);

          if (hasParttimeTriple || trainAtA || trainAtB || trainAtC) {
            filteredOut++;
            continue;
          }

          const patterns = [1,2];
          let anyValid   = false;

          patterns.forEach(function(pId){
            const rotateOps = buildRotate3OperationsPattern(me, lB, lC, groupA, groupB, groupC, pId);
            const ok = validateOperations(rotateOps, baseState);
            if(!ok){
              filteredOut++;
              return;
            }
            anyValid = true;
            const priority = getPriority(lB,me) + getPriority(lC,me);
            c3.push({lA:me,lB:lB,lC:lC,priority:priority,patternId:pId});
          });

          if (!anyValid) continue;
        }
      }

      const grouped3 = new Map();
      c3.forEach(item=>{
        const keyB = signatureKey(item.lB);
        const keyC = signatureKey(item.lC);
        const key  = keyB + "||" + keyC + "||" + item.patternId;
        if(!grouped3.has(key)) grouped3.set(key, []);
        grouped3.get(key).push(item);
      });

      const c3display = [];
      grouped3.forEach(list=>{
        const rep      = list[0];
        const priority = Math.max.apply(null, list.map(function(it){ return it.priority; }));
        c3display.push({ lA:rep.lA, lB:rep.lB, lC:rep.lC, priority:priority, patternId:rep.patternId });
      });

      note.textContent = "※条件不一致の組み合わせは除外（" + filteredOut + "件）";
      results3wayDiv.appendChild(note);

      if(!c3display.length){
        results3wayDiv.insertAdjacentHTML("beforeend","<p class=\"muted\">候補はありません</p>");
      }else{
        c3display.sort(function(aItem,bItem){ return bItem.priority-aItem.priority; });
        const tbl = document.createElement('table');
        tbl.innerHTML = "<thead><tr>" +
          "<th class=\"print-checkbox-col\">印刷</th><th>担当者</th><th>該当する授業</th>" +
          "<th>担当者</th><th>該当する授業</th>" +
          "<th>移動案</th>" +
        "</tr></thead>";
        const tb = document.createElement('tbody');

        c3display.forEach(cand=>{
          const A3 = cand.lA, B3 = cand.lB, C3 = cand.lC;

          const teachersB = getAllTeachersForLesson(B3);
          const teachersC = getAllTeachersForLesson(C3);

          const namesBForTT = teachersB.length ? teachersB : [B3.teacher];
          const namesCForTT = teachersC.length ? teachersC : [C3.teacher];

          const labelB  = namesBForTT.join('・');
          const labelC  = namesCForTT.join('・');
          const selfLabel = namesSelfFor3.join('＋') || a;

          let moveBody = "";
          let txtMyMove = "";
          let txtOppMove = "";
          
          const fullBLesson = stripHtmlTags(renderLessonTextForResult(B3));
          const fullCLesson = stripHtmlTags(renderLessonTextForResult(C3));

          if (cand.patternId === 2) {
            moveBody =
              selfLabel + "：" + formatSlot(A3.day,A3.period) + " → " + formatSlot(C3.day,C3.period) + "<br>" +
              labelC + "：" + formatSlot(C3.day,C3.period) + " → " + formatSlot(B3.day,B3.period) + "<br>" +
              labelB + "：" + formatSlot(B3.day,B3.period) + " → " + formatSlot(A3.day,A3.period);
            txtMyMove = `${stripHtmlTags(renderMyLessonText(A3))} ➔ ${formatSlot(C3.day,C3.period)}`;
            txtOppMove = `${fullCLesson} ➔ ${formatSlot(B3.day,B3.period)}<br>${fullBLesson} ➔ ${formatSlot(A3.day,A3.period)}`;
          } else {
            moveBody =
              selfLabel + "：" + formatSlot(A3.day,A3.period) + " → " + formatSlot(B3.day,B3.period) + "<br>" +
              labelB + "：" + formatSlot(B3.day,B3.period) + " → " + formatSlot(C3.day,C3.period) + "<br>" +
              labelC + "：" + formatSlot(C3.day,C3.period) + " → " + formatSlot(A3.day,A3.period);
            txtMyMove = `${stripHtmlTags(renderMyLessonText(A3))} ➔ ${formatSlot(B3.day,B3.period)}`;
            txtOppMove = `${fullBLesson} ➔ ${formatSlot(C3.day,C3.period)}<br>${fullCLesson} ➔ ${formatSlot(A3.day,A3.period)}`;
          }

          const tr = document.createElement('tr');
          const pId = `3way_${A3.day}${A3.period}_${B3.teacher}_${C3.teacher}_p${cand.patternId}`;

          const tdCb = document.createElement('td');
          tdCb.className = 'print-checkbox-col';
          const totalOppNames = `${labelB}|${labelC}`;

          const encOrigin = escapeHtmlAttr(currentOriginText);
          const encMyMove = escapeHtmlAttr(txtMyMove);
          const encOppMove = escapeHtmlAttr(txtOppMove);
          const encOppName = escapeHtmlAttr(totalOppNames);
          const encOriginTeacher = escapeHtmlAttr(a);

          tdCb.innerHTML = `<input type="checkbox" class="print-row-cb" data-print-id="${pId}" data-origin-lesson="${encOrigin}" data-my-move="${encMyMove}" data-opp-move="${encOppMove}" data-opp-names="${encOppName}" data-origin-teacher="${encOriginTeacher}">`;

          tr.appendChild(tdCb);

          const tdContent = document.createElement('td');
          tdContent.innerHTML = "<span class=\"teacher-name\" data-teachers=\"" + namesBForTT.join('|') + "\">" + labelB + "</span>";
          tr.appendChild(tdContent);

          const tdLessonB = document.createElement('td');
          tdLessonB.innerHTML = renderLessonTextForResult(B3);
          tr.appendChild(tdLessonB);

          const tdNameC = document.createElement('td');
          tdNameC.innerHTML = "<span class=\"teacher-name\" data-teachers=\"" + namesCForTT.join('|') + "\">" + labelC + "</span>";
          tr.appendChild(tdNameC);

          const tdLessonC = document.createElement('td');
          tdLessonC.innerHTML = renderLessonTextForResult(C3);
          tr.appendChild(tdLessonC);

          const tdMove = document.createElement('td');
          tdMove.innerHTML = moveBody;
          tr.appendChild(tdMove);

          tb.appendChild(tr);
        });
        tbl.appendChild(tb);
        results3wayDiv.appendChild(tbl);
      }

      // --- A⇔B・A⇔C候補 ---
      const h2chain = document.createElement('h2');
      h2chain.textContent = "■ A⇔B・A⇔C候補";
      results3wayDiv.appendChild(h2chain);

      if (chainCandidates.length) {
        const tblChain = document.createElement('table');
        tblChain.innerHTML = "<thead><tr>" +
          "<th class=\"print-checkbox-col\">印刷</th><th>交換１</th><th>交換２</th><th>移動案</th>" +
        "</tr></thead>";
        const tbChain = document.createElement('tbody');

        chainCandidates.forEach((cand, idx)=>{
          const mainB        = cand.mainB;
          const blockLesson  = cand.blockLesson;
          const partner      = cand.partner;
          const teacherA     = cand.teacherA;
          const teacherB     = cand.teacherB;
          const teacherBlock = cand.teacherBlock;
          const teacherPartner = cand.teacherPartner;

          const row       = document.createElement('tr');
          const pId = `chain_${me.day}${me.period}_${mainB.teacher}_idx${idx}`;

          const moveDescTxt =
            `${stripHtmlTags(renderLessonTextForResult(blockLesson))} ➔ ${formatSlot(partner.day, partner.period)}<br>` +
            `${stripHtmlTags(renderLessonTextForResult(partner))} ➔ ${formatSlot(blockLesson.day, blockLesson.period)}<br>` +
            `${stripHtmlTags(renderMyLessonText(me))} ➔ ${formatSlot(mainB.day, mainB.period)}<br>` +
            `${stripHtmlTags(renderLessonTextForResult(mainB))} ➔ ${formatSlot(me.day, me.period)}`;

          const tdCb = document.createElement('td');
          tdCb.className = 'print-checkbox-col';

          const encOrigin = escapeHtmlAttr(currentOriginText);
          const encMyMove = escapeHtmlAttr(`${stripHtmlTags(renderMyLessonText(me))} ➔ ${formatSlot(mainB.day, mainB.period)}`);
          const encOppMove = escapeHtmlAttr(stripHtmlTags(moveDescTxt));
          const encOppName = escapeHtmlAttr(teacherB);
          const encOriginTeacher = escapeHtmlAttr(a);

          tdCb.innerHTML = `<input type="checkbox" class="print-row-cb" data-print-id="${pId}" data-origin-lesson="${encOrigin}" data-my-move="${encMyMove}" data-opp-move="${encOppMove}" data-opp-names="${encOppName}" data-origin-teacher="${encOriginTeacher}">`;

          const mainLabel =
            teacherA + "：" + renderLessonTextForResult(me) + " ⇔ " +
            teacherB + "：" + renderLessonTextForResult(mainB);

          const subLabel =
            teacherBlock + "：" + renderLessonTextForResult(blockLesson) + " ⇔ " +
            teacherPartner + "：" + renderLessonTextForResult(partner);

          row.appendChild(tdCb);
          row.insertAdjacentHTML('beforeend', "<td>" + mainLabel + "</td><td>" + subLabel + "</td><td>" + moveDescTxt + "</td>");
          tbChain.appendChild(row);
        });

        tblChain.appendChild(tbChain);
        results3wayDiv.appendChild(tblChain);
      } else {
        const pCond = document.createElement('p');
        pCond.className = 'muted';
        pCond.textContent =
          "※表示条件: 教員Aのみ選択中で、選んだ授業が教員Aの単独担当かつ、" +
          "研修・会議・非常勤に該当しない1対1候補が3件以下のとき、" +
          "ブロック授業を1回動かすことでA⇔Bの交換が可能となる組み合わせを表示（候補に研修・会議・非常勤は含めない）";
        results3wayDiv.appendChild(pCond);
      }

      // --- --- 文理特別ローテ --- ---
      const bunriCandidates = [];
      if (!useJoint && a && normal1to1Count <= 3 && isBunriUnitForLesson(me)) {
        const grade = me.grade;
        const cls   = me.class;

        const myBunriUnit  = getUnitLessons(me);
        const myBunriClass = new Set(myBunriUnit.map(function(x){ return x.grade + "-" + x.class; }));

        const bunLessons = lessons.filter(function(x){
          return x.school === me.school &&
                 x.grade === grade &&
                 x.class === cls &&
                 x.course === "文";
        });
        const riLessons = lessons.filter(function(x){
          return x.school === me.school &&
                 x.grade === grade &&
                 x.class === cls &&
                 x.course === "理";
        });

        const pairMap = new Map();
        bunLessons.forEach(lBun=>{
          riLessons.forEach(lRi=>{
            if (lBun.day !== lRi.day || lBun.period !== lRi.period) return;
            if (lBun.teacher === a && lRi.teacher === a) return;

            const bunUnit = getUnitLessons(lBun);
            const riUnit  = getUnitLessons(lRi);
            const allKeys = new Set();
            bunUnit.forEach(x => allKeys.add(x.grade + "-" + x.class));
            riUnit.forEach(x => allKeys.add(x.grade + "-" + x.class));
            let hasExtra = false;
            for (const key2 of allKeys) {
              if (!myBunriClass.has(key2)) {
                hasExtra = true;
                break;
              }
            }
            if (hasExtra) return;

            const keyPair = lBun.day + "|" + lBun.period + "|" + lBun.teacher + "|" + lRi.teacher;
            if (pairMap.has(keyPair)) return;

            const ops = [
              { teacher: a,            dayFrom: me.day,   periodFrom: me.period,   dayTo: lBun.day, periodTo: lBun.period },
              { teacher: lBun.teacher, dayFrom: lBun.day, periodFrom: lBun.period, dayTo: me.day,   periodTo: me.period },
              { teacher: lRi.teacher,  dayFrom: lRi.day,  periodFrom: lRi.period,  dayTo: me.day,   periodTo: me.period }
            ];

            if (!validateOperations(ops, scheduleState, { allowTraining: true })) return;

            pairMap.set(keyPair, {
              bun: lBun,
              ri : lRi
            });
          });
        });

        pairMap.forEach(function(v){
          bunriCandidates.push(v);
        });
      }

      if (bunriCandidates.length) {
        const h2spec = document.createElement('h2');
        h2spec.textContent = "■ A⇔B＋C候補";
        results3wayDiv.appendChild(h2spec);

        const tblSpec = document.createElement('table');
        tblSpec.innerHTML = "<thead><tr>" +
          "<th class=\"print-checkbox-col\">印刷</th><th>A（文理）</th><th>文側</th><th>理側</th>" +
          "<th>移動案</th>" +
          "<th>予定（注意）</th>" +
        "</tr></thead>";
        const tbSpec = document.createElement('tbody');

        bunriCandidates.forEach((cand, idx)=>{
          const bun = cand.bun;
          const ri  = cand.ri;

          const tr = document.createElement('tr');
          const pId = `bunri_${me.day}${me.period}_${bun.teacher}_idx${idx}`;

          const moveDesc =
            `${stripHtmlTags(renderLessonTextForResult(bun))} ➔ ${formatSlot(me.day, me.period)}<br>` +
            `${stripHtmlTags(renderLessonTextForResult(ri))} ➔ ${formatSlot(me.day, me.period)}`;

          const tdCb = document.createElement('td');
          tdCb.className = 'print-checkbox-col';
          const totalBunriNames = `${bun.teacher}・${ri.teacher}`;

          const encOrigin = escapeHtmlAttr(currentOriginText);
          const encMyMove = escapeHtmlAttr(`${stripHtmlTags(renderMyLessonText(me))} ➔ ${formatSlot(bun.day, bun.period)}`);
          const encOppMove = escapeHtmlAttr(stripHtmlTags(moveDesc));
          const encOppName = escapeHtmlAttr(totalBunriNames);
          const encOriginTeacher = escapeHtmlAttr(a);

          tdCb.innerHTML = `<input type="checkbox" class="print-row-cb" data-print-id="${pId}" data-origin-lesson="${encOrigin}" data-my-move="${encMyMove}" data-opp-move="${encOppMove}" data-opp-names="${encOppName}" data-origin-teacher="${encOriginTeacher}">`;

          const labelA   = a + "：" + renderLessonTextForResult(me);
          const labelBun = bun.teacher + "：" + renderLessonTextForResult(bun);
          const labelRi  = ri.teacher + "：" + renderLessonTextForResult(ri);

          const moveUiDesc =
            a + "：" + formatSlot(me.day, me.period) + " → " + formatSlot(bun.day, bun.period) + "<br>" +
            bun.teacher + "：" + formatSlot(bun.day, bun.period) + " → " + formatSlot(me.day, me.period) + "<br>" +
            ri.teacher + "：" + formatSlot(ri.day, ri.period) + " → " + formatSlot(me.day, me.period);

          const warnSet = new Set();
          warnSet.add(getTrainingDetailLabel(a, me.day, me.period));
          warnSet.add(getTrainingDetailLabel(a, bun.day, bun.period));
          warnSet.add(getTrainingDetailLabel(bun.teacher, me.day, me.period));
          warnSet.add(getTrainingDetailLabel(bun.teacher, bun.day, bun.period));
          warnSet.add(getTrainingDetailLabel(ri.teacher, me.day, me.period));
          warnSet.add(getTrainingDetailLabel(ri.teacher, ri.day, ri.period));

          const warnings = Array.from(warnSet)
            .filter(function(s){ return s && s.trim(); })
            .join("<br>");

          tr.appendChild(tdCb);
          tr.insertAdjacentHTML('beforeend', "<td>" + labelA + "</td><td>" + labelBun + "</td><td>" + labelRi + "</td><td>" + moveUiDesc + "</td><td class=\"training-conflict\">" + (warnings || "") + "</td>");
          tbSpec.appendChild(tr);
        });

        tblSpec.appendChild(tbSpec);
        results3wayDiv.appendChild(tblSpec);
      }

      syncCheckboxesState();
    });

    // カートデータ内のチェンジイベントハンドラ定義の一元化
    function bindTableCheckboxes(container) {
      if(!container) return;
      container.addEventListener('change', (e) => {
        const cb = e.target.closest('.print-row-cb');
        if (!cb) return;

        const pId = cb.dataset.printId;
        if (cb.checked) {
          printCart.set(pId, {
            originLessonText: cb.dataset.originLesson,
            myMove: cb.dataset.myMove,
            oppMove: cb.dataset.oppMove,
            oppNames: cb.dataset.oppNames || "",
            originTeacher: cb.dataset.originTeacher || ""
          });
        } else {
          printCart.delete(pId);
        }
        updatePrintBarUI();
      });
    }

    bindTableCheckboxes(results1to1Div);
    bindTableCheckboxes(results3wayDiv);

    executePrintBtn && executePrintBtn.addEventListener('click', () => {
      if (!printCart.size) {
        alert("印刷したい交換案のチェックボックスを選択してください。");
        return;
      }

      const printWindow = window.open('', '_blank');
      
      const lessonsGroup = new Map();
      printCart.forEach((item) => {
        if (!lessonsGroup.has(item.originLessonText)) {
          lessonsGroup.set(item.originLessonText, []);
        }
        lessonsGroup.get(item.originLessonText).push(item);
      });

      let firstCartItem = printCart.values().next().value;
      const displayProposalTeacher = (firstCartItem && firstCartItem.originTeacher) ? firstCartItem.originTeacher : "未選択";

      let html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>授業変更のご相談</title>
          <style>
            body { font-family: system-ui, sans-serif; margin: 40px; color: #000; line-height: 1.6; background: #fff; }
            .header-box { border: 2px solid #000; padding: 15px 20px; margin-bottom: 30px; background: #fff; }
            .header-box h1 { margin: 0 0 10px 0; font-size: 1.5rem; text-align: center; color: #000; border-bottom: 2px solid #000; padding-bottom: 8px; }
            .info-line { font-size: 1.1rem; margin: 6px 0; }
            .intro-text { font-size: 1rem; margin-bottom: 25px; color: #000; }
            
            .lesson-section { margin-bottom: 30px; page-break-inside: avoid; }
            .lesson-title { font-size: 1.2rem; font-weight: bold; background: #fff; border: 1px solid #000; padding: 8px 12px; margin-bottom: 15px; }
            
            .case-container { border: 1px solid #000; padding: 12px 15px; margin-bottom: 12px; background: #fff; page-break-inside: avoid; }
            .case-num { font-weight: bold; color: #000; font-size: 0.95rem; margin-bottom: 6px; border-bottom: 1px dotted #000; padding-bottom: 2px; }
            .move-line { margin: 6px 0; font-size: 0.95rem; line-height: 1.4; }
            @media print {
              body { margin: 20px; color: #000; background: #fff; }
              .header-box, .lesson-title, .case-container { border-color: #000 !important; background: #fff !important; color: #000 !important; }
            }
          </style>
        </head>
        <body>
          <div class="header-box">
            <h1>授業変更のご相談</h1>
            <div class="info-line"><strong>提案者：</strong> ${displayProposalTeacher}</div>
          </div>
          <div class="intro-text">
            以下のクラスについて変更・交換をお願いしたく存じます。
          </div>
      `;

      lessonsGroup.forEach((cases, lessonName) => {
        html += `
          <div class="lesson-section">
            <div class="lesson-title">対象のクラス： ${lessonName}</div>
        `;

        cases.forEach((item, index) => {
          let rawOppName = item.oppNames || "交換相手";
          if (rawOppName.includes('|')) {
            rawOppName = rawOppName.split('|').join('・');
          }
          const oppLabel = rawOppName ? `（${rawOppName}）` : "（交換相手）";
          
          const currentOriginTeacher = item.originTeacher || teacherSelectA.value;

          html += `
            <div class="case-container">
              <div class="case-num">✅ 変更案 ${index + 1}</div>
              <div class="move-line"><strong>（${currentOriginTeacher}）：</strong> ${item.myMove}</div>
              <div class="move-line"><strong>${oppLabel}：</strong> ${item.oppMove}</div>
            </div>
          `;
        });

        html += `</div>`;
      });

      html += `
          <p style="margin-top: 40px; text-align: right; font-size: 0.9rem; color: #000;">授業の交換先をすぐに見つける君 ©Takahiro Iimura</p>
        </body>
        </html>
      `;

      printWindow.document.open();
      printWindow.document.write(html);
      printWindow.document.close();

      printWindow.onload = function() {
        printWindow.print();
      };
    });


    // ===== 右上ツールチップ（ホバー／クリック固定） =====
    document.addEventListener('mouseover', (e) => {
      const span = e.target.closest('.teacher-name');
      if (!span) return;
      if (pinnedTeachers && pinnedTeachers.length) return;

      const raw = span.dataset.teachers || "";
      const names = raw.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
      if (!names.length) return;
      const html = buildTeacherTimetableHTML(names);
      timetableTooltip.innerHTML = html;
      timetableTooltip.classList.remove('hidden');
    });

    document.addEventListener('mouseout', (e) => {
      const span = e.target.closest('.teacher-name');
      if (!span) return;
      if (pinnedTeachers && pinnedTeachers.length) return;
      timetableTooltip.classList.add('hidden');
    });

    document.addEventListener('click', (e) => {
      const span = e.target.closest('.teacher-name');
      if (!span) return;

      const raw = span.dataset.teachers || "";
      const names = raw.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
      if (!names.length) return;

      const newKey = names.join('|');
      const currentKey = pinnedTeachers ? pinnedTeachers.join('|') : null;

      if (pinnedTeachers && currentKey === newKey) {
        pinnedTeachers = null;
        timetableTooltip.classList.add('hidden');
        return;
      }

      pinnedTeachers = names;
      const html = buildTeacherTimetableHTML(names);
      timetableTooltip.innerHTML = html;
      timetableTooltip.classList.remove('hidden');
    });

    // ===== 起動時 =====
    window.addEventListener('DOMContentLoaded', ()=>{
      if(EMBEDDED_TRAININGS_CSV.trim())  loadTrainingsFromText(EMBEDDED_TRAININGS_CSV);
      if(EMBEDDED_LESSONS_HS_CSV.trim()) loadLessonsFromTextHS(EMBEDDED_LESSONS_HS_CSV);
      if(EMBEDDED_LESSONS_JH_CSV.trim()) loadLessonsFromTextJH(EMBEDDED_LESSONS_JH_CSV);
      updateTeacherATimetable();
    });
  </script></body></html>
