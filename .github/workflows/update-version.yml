name: Update version info

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          TODAY=$(TZ=Asia/Tokyo date '+%Y/%m/%d')
          CURRENT=$(python3 -c "import json; d=json.load(open('version.json')); print(d['count'])")
          NEW_COUNT=$((CURRENT + 1))
          echo "{\"date\":\"${TODAY}\",\"count\":${NEW_COUNT}}" > version.json
          echo "Updated: ${TODAY}, count: ${NEW_COUNT}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "auto: update version [skip ci]"
          git push
