name: Update version info

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update date and increment counter
        run: |
          TODAY=$(TZ=Asia/Tokyo date '+%Y/%m/%d')
          CURRENT=$(grep -oP "(?<=APP_UPDATE_COUNT = )\d+" index.html)
          NEW_COUNT=$((CURRENT + 1))
          sed -i "s|APP_LAST_UPDATED = '[^']*'|APP_LAST_UPDATED = '${TODAY}'|" index.html
          sed -i "s|APP_UPDATE_COUNT = [0-9]*|APP_UPDATE_COUNT = ${NEW_COUNT}|" index.html
          echo "Updated: ${TODAY}, count: ${NEW_COUNT}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: update version info [skip ci]"
          git push
